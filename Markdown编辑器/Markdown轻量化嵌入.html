    <script>
        //类型库.js

        "use strict";

        /*
         - 致力于解决js编码痛点
         - 核心问题：
           - 对象全靠字面量{}构造、分散的函数来实现功能，很容易漏掉关键字段、蕴含隐式运行时错误
           - 过分分散的逻辑到处都有副作用状态的可能，不熟悉项目的根本不知道哪些对象是干什么的，不利于后人阅读、理解、维护
           - JSON的解析和导入不纯，容易泄漏不应该导出的属性
         - 解决方式 & 编码风格：
           - 定义所引入该库的类，填入信息
           - 导入、加载、实例化某个对象时，class会像修饰符一样接住对象，返回一个进阶类，此时可以调用进阶类的各种接口
           - 实际码风类似：
             - ImageObject = ImageClass.wrap({ src: "date", width: 400, height: 300 });
             - console.log(ImageObject.getBlobUrl());
         - 理念：
           - 基于该库的类都是其修饰作用，理论上你可以回归 字面量{}地狱、分散函数地狱、胡乱传this搞函数参数设计 的风格。
           - 基于上面这点，我不希望写什么 new ImageClass("date",400,300); 这种用构造函数的参数顺序来描述对象的“八股文”
           - 也有良好的性质，对于现有项目，无非写一个定义，在构造是加一个 MyClass.wrap({ ... }) 这种类似类型修饰的东西即可无缝进阶，及其轻量化
           - 到时候想在类里面集成什么方法就继承什么方法，想怎么在对象上附着什么属性就附着什么属性
           - 也不用死记构造函数的参数意义（因为必定只有一个参数，也只用来传递待修饰对象）
           - 让js写的像C++。（不是）
        */

        // 基类：统一处理对象参数、必要字段校验、toJSON 控制，且不可避免的带有一个wrap函数进行修饰的路线控制
        class Struct {
            // 子类必须覆盖这些静态属性（或实例属性）
            static required = [];     // 必须提供的字段名
            static serializable = []; // 需要被序列化的字段名（白名单）
            // 如果不提供，默认序列化所有“可枚举且非函数”的属性

            // 重要函数：显式使用 Class.wrap(Object) 的形式修饰对象，不推荐也不应该使用 new Class({ ... }) 来修饰对象
            static wrap(props) {
                if (props instanceof this) return props;
                return new this(props);
            }

            // 能进来的必须是过了wrap的，是允许new并且进行初始化的，不会有问题，所以才走构造函数
            // 所以完全可以从0开始构造对象，不要管什么覆盖不覆盖的。
            constructor(props) {
                // 校验必要字段
                const required = this.constructor.required || [];
                for (let key of required) if (!(key in props)) throw new Error(`Missing required field: ${key}`);
                // 赋值
                Object.assign(this, props);
                // 后续初始化钩子
                if (this.init) this.init();
            }

            toJSON() {
                const serializable = this.constructor.serializable;
                const obj = {};
                // 白名单模式
                if (serializable && serializable.length) for (const key of serializable) if (key in this) obj[key] = this[key];
                // 默认：忽略函数和原型链，只取自身可枚举属性
                else for (const key in this) if (this.hasOwnProperty(key) && typeof this[key] !== 'function') obj[key] = this[key];
                return obj;
            }
        }

    </script>

        const RendererVersion = {

            ADVANCED: "ADVANCED",//进阶/全新渲染器，本人目前持续维护的版本，很多文档文章都基于这个编写和渲染
            CORRELATION_DIAGRAM: "CORRELATION_DIAGRAM"//还处于幻想阶段的一种图性渲染器，基于进阶渲染器的设计哲学，但改变了知识间的关联方式，目前没有任何进展
        };

        const renderSettings = {

        };

        // #endregion --------------- 定义与获取 --------------- 






        // #region ----------------------------------------- 构造修饰对象 ----------------------------------------- 


        class ImageItem extends Struct {
            static required = ["data", "width"];
            static serializable = ["data", "width", "height"];

            constructor(props) {
                super(props);
                this._blobUrl = null;
                this._blob = null;
            }

            getBlobUrl() {
                if (!this._blobUrl) {
                    // 生成 blob URL ，将 base64 data 转为 Blob
                    const base64Data = this.data;
                    const mime = base64Data.match(/data:(image\/\w+);/)?.[1] || 'image/png';
                    const byteString = atob(base64Data.split(',')[1]);
                    const ab = new ArrayBuffer(byteString.length);
                    const ia = new Uint8Array(ab);
                    for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                    this._blob = new Blob([ab], { type: mime });
                    this._blobUrl = URL.createObjectURL(this._blob);
                }
                return this._blobUrl;
            }
        }

        //文章类（虽然只有一个实例。）

        class Article extends Struct {
            static required = [Article_markdown];
            static serializable = [Article_markdown, Article_images, Article_format, Article_configuration];

            constructor(props) {
                super(props);
                //非重要子段自动补全
                if (!this[Article_format]) this[Article_format] = RendererVersion.ADVANCED;
                if (!this[Article_images]) this[Article_images] = {};
                if (!this[Article_configuration]) this[Article_configuration] = {};
            }

            // #region --------------- Markdown转义器 --------------- 

            // 将自定义Markdown的语法转换为可渲染html
            // markdown 文章主体，imgs图片元数据（图片ID映射图片元数据）
            CreateRenderableHTMLfromMarkdown(setting = {}) {

                if (!marked) return "";

                // 临时渲染配置解析
                const _isDistribution = setting?.isDistribution ?? false;
                const _RendererVersion = this[Article_format];

                //数据读取与处理
                let markdown = this[Article_markdown] ?? "";
                const imgs = this[Article_images] ?? {};


                // 进阶渲染器的独特设计
                if (_RendererVersion === RendererVersion.ADVANCED) {

                    // 1. 引入自定义语法 [!note]文本[/!note]
                    // 根据配置，自行选择注释去向
                    markdown = markdown.replace(/[^\\]\[!note\](((?![^\\]\[!note\])[\s\S])*?)[^\\]\[\/!note\]/g, (_, a) => {
                        if (_isDistribution) return "";
                        //我觉得note标签应该可以独占一行，而不是影响换行文档流，不然编码很难受。
                        //所以我最多在文本标签内删除收尾一个换行
                        a = a.slice(a[0] === "\n", a.length - (a[a.length - 1] === "\n"));
                        return a;
                    });

                    //将残留注释的破坏性转义字符串删掉
                    markdown = markdown.replace(/\\\[!note\]/g, (_) => {
                        return _.slice(1);
                    });
                    markdown = markdown.replace(/\\\[\/!note\]/g, (_) => {
                        return _.slice(1);
                    });

                    // 2. 引入自定义语法 ![自定义图片名](quote:图片ID)
                    // 匹配之后，获取两个参数，图片ID用imgs查找对应图片的元数据
                    markdown = markdown.replace(/^(.*?)!\[(.*?)\]\(quote:(.*?)\)(.*?)$/gm, (match, str1, arg, ID, str2) => {
                        const arr = arg.split("|");
                        let newName = arr?.[0] ?? "";
                        let newSize = arr?.[1] ?? "100%";
                        if (imgs[ID] && newSize) {
                            imgs[ID] = ImageItem.wrap(imgs[ID]);
                            const imgObj = imgs[ID];
                            //修正newSize
                            if (newSize.at(-1) === "%") newSize = newSize.slice(0, newSize.length - 1);
                            // 计算缩放后的宽度
                            return `${str1}<img src="${imgObj.getBlobUrl()}" alt="${newName}" style="width: calc(var(--base-font-size) / var(--const-base-font-size) * ${newSize} / 100 * ${imgObj.width}px ); height: auto;">\n${str2}`;
                            // return `${str}<img src="${imgObj.data}" alt="${newName}" style="width: calc(var(--base-font-size) / var(--const-base-font-size) * ${newSize} / 100 * ${imgObj.width}px ); height: auto;">\n`;
                        }
                        return "";
                    });

                }

                const customRenderer = new marked.Renderer();
                customRenderer.space = function (token) {
                    const newlineCount = (token.raw.match(/\n/g) || []).length;
                    return '<br>'.repeat(newlineCount);
                };

                let html = null;

                if (_RendererVersion === RendererVersion.ADVANCED) {
                    marked[ExtensionsPDkey][emptyLinesExtension.name] = true;
                    html = marked.parse(markdown, {
                        breaks: true,
                        renderer: customRenderer
                    });
                    // html = marked.parse(markdown, {
                    //     // renderer: customRenderer,
                    //     breaks: true, // 单个\n渲染为<br>，多行文本按换行显示
                    // });
                }
                else if (_RendererVersion === RendererVersion.PRIMITIVE) {
                    marked[ExtensionsPDkey][emptyLinesExtension.name] = false;
                    html = marked.parse(markdown, {
                        breaks: false,// 回归传统模式（单轮parse会覆盖全局的use）
                    });
                }

                // 4. 后处理：高亮所有代码块
                // 创建临时 DOM 容器
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                const codeBlocks = tempDiv.querySelectorAll('pre code');
                codeBlocks.forEach(block => {
                    // 提取语言（marked 默认添加 language-xxx 类）
                    let lang = '';
                    const classMatch = block.className.match(/language-(\w+)/);
                    if (classMatch) lang = classMatch[1];
                    const codeText = block.textContent || '';
                    if (codeText && window.hljs) {
                        try {
                            let highlighted;
                            if (lang && hljs.getLanguage(lang)) {
                                highlighted = hljs.highlight(codeText, { language: lang }).value;
                            } else {
                                highlighted = hljs.highlightAuto(codeText).value;
                            }
                            block.innerHTML = highlighted;
                            block.classList.add('hljs');
                        } catch (err) {
                            console.warn('代码高亮失败:', err);
                        }
                    }
                });

                return tempDiv.innerHTML;
                // return html;
            }

            // #endregion --------------- Markdown转义器 --------------- 

        }

        // 文章对象主体（权威对象）
        let MarkDownObjectBody = Article.wrap({
            [Article_markdown]: "",
            [Article_format]: RendererVersion.ADVANCED,
            [Article_images]: {},
            [Article_configuration]: {}
        });

        // #endregion ----------------------------------------- 构造修饰对象 -----------------------------------------





        // #region --------------- 核心渲染区域 --------------- 

        //气死我了。臭marked单轮parse啥扩展也不生效，只能用use并且在扩展里硬编码。
        //避雷marked库。气死我了。

        //闭包管理扩展，唯一暴露关键字对象，以及定义自己的扩展

        //扩展控制开关关键字
        const ExtensionsPDkey = Symbol("ExtensionsPD");

        function markedBindExtensions(marked, Extensions) {

            //存储管理对象，扩展名映射一个布尔值，表示是否启用
            if (!marked[ExtensionsPDkey]) marked[ExtensionsPDkey] = {};

            // 篡改扩展，强制写入一个是否启用的逻辑

            //扩展的必要模版，检测自己是否被开启
            Extensions.forEach(Extension => {
                if (Extension?.name) {
                    marked[ExtensionsPDkey][Extension.name] = true;
                    if (Extension?.tokenizer) {
                        const _tokenizer = Extension.tokenizer;
                        Extension.tokenizer = function (...args) {
                            //关键：if判断是否启用
                            if (marked[ExtensionsPDkey][Extension.name]) return _tokenizer.call(this, ...args);
                            return false;
                        }
                    }
                }
            })

            // 调用use
            marked.use({ extensions: Extensions });
        }

        //设置函数
        function setExtensionsPD(obj, pd) {
            if (typeof obj === "string") marked[ExtensionsPDkey][obj] = pd;
            else if (obj?.name) marked[ExtensionsPDkey][obj.name] = pd;
        }

        // 自定义扩展：连续空行转 <br>
        const emptyLinesExtension = {
            name: 'emptyLines',
            level: 'block',
            tokenizer(src) {
                // 匹配连续空行（一个或多个换行符，且该行只有空白）
                const rule = /^\n+/;
                const match = rule.exec(src);
                if (match) {
                    const count = match[0].length;  // 连续换行符个数
                    return {
                        type: 'emptyLines',
                        raw: match[0],
                        count: count,
                    };
                }
                return false;
            },
            renderer(token) {
                // 输出对应数量的 <br>
                return '<br>'.repeat(token.count - 1);
            },
        };

        //实例化
        markedBindExtensions(marked, [emptyLinesExtension]);

        // // 自定义渲染器，为代码块添加高亮
        // const renderer = new marked.Renderer();
        // renderer.code = function (code, language) {
        //     // 检测语言是否有效
        //     const validLang = (language && hljs.getLanguage(language)) ? language : 'plaintext';
        //     // 高亮处理
        //     const highlighted = hljs.highlight(code, { language: validLang }).value;
        //     // 返回标准的 <pre><code> 结构，并保留语言类名
        //     return `<pre><code class="hljs language-${validLang}">${highlighted}</code></pre>`;
        // };

        // marked.setOptions({ renderer: renderer })

        // #endregion --------------- 核心渲染区域 --------------- 





        // #region --------------------------------------- 核心渲染对象类 ---------------------------------------

        // 关键：更新预览的函数
        let updatePreview = () => {
            preview.innerHTML = MarkDownObjectBody.CreateRenderableHTMLfromMarkdown(renderSettings);
        }

        // #endregion ----------------------------------------- 核心渲染对象类 ----------------------------------------- 





        //            -------------------------------------------------------------------                 -------------------------------------------------------------------
        //            -------------------------------------------------------------------                 -------------------------------------------------------------------

        //            -------------------------------------------------------------------                 -------------------------------------------------------------------



    </script>


    <script>

        //亮色模式（默认）
        preview.classList.remove("dark-mode");
        //暗色模式
        // preview.classList.add("dark-mode");



        MarkDownObjectBody = Article.wrap(
            {
                "markdown": "# 实时Markdown编辑器\n\n输入**Markdown**语法，右侧将实时预览效果！\n\n![](quote:大丰收的)\n\n## 特性\n- 可离线编辑\n- 更强大的Markdown编辑器，支持混合html语法进行编辑\n- 离线图片的管理和加载与简单的语法\n- 支持标题、列表、链接、图片、代码块、引用块等\n- 实时渲染\n- 响应式布局\n- 亮色/暗色主题切换\n- 只编辑模式和只预览模式\n- 界面干净、整洁，合理圆角\n- “所见即所得”的换行理念\n- 引入文档的“注释”，解决文档的发行版本和编辑版本之间的矛盾\n- 多种渲染器，兼容传统渲染模式的同时支持衍生的渲染模式\n\n## 代码示例\n```javascript\n// 这是一段JavaScript代码\nfunction greet() {\n    console.log(\"Hello, Markdown!\");\n}\n```\n\n## 自定义语法指导\n### 离线图片加载\n与**Markdown**原生的链接语法相似，采取形如 **`![图片名](quote:图片ID)`** 的语法\n这里需要“quote:”紧跟“图片ID”紧跟“)”，而且独占一行，否则就会被当成普通链接语法进行处理\n**图片ID**可在 **图片管理** 界面查看和配置，点击左上方 **图片管理** 按钮即可进入\n根据界面提示导入图片并填写图片ID，接下来你就可以填入导入的图片ID来加载图片了！\n特别的，在图片名一栏中写成了形如 `字符串|字符串` 的格式，则是**参数语法**\n该语法允许传递一些特殊的参数影响最终渲染效果\n目前的标准是：\n以进行“|”分割，参数依次的含义：\n**1.** 图片名\n**2.** 缩放百分比（前缀必须是数字，但带不带百分号都可以，最后的单位总是自动转为百分比，比如100是原始大小，50%则是一半，目前推荐标准是带百分比，更清晰一点）\n注意该语法目前仅限离线图片，传统链接语法没有提供参数语法\n\n### 非发行版注释\n语法形如 **`\\[!note]文本[/!note]`**\n其中的“文本”部分就是待隐藏的内容\n文本内容不局限于单行，是**支持多行的**\n如果被隐藏，则内容不出现在文档的实际渲染中（原理是直接删除字符串）\n如果是显示，则文本内容正常出现在文档流中，而 `\\[!note]` 等部分消失\n该语法是最高级语法，比任何标签、Markdown语法都优先（原理是直接一个正则）\n如果你的确需要写成类似字面量形式，则建议用反斜杠转移其中的字符，破坏语法规则即可\n可能需要注意“截断”注释内容以后，会不会影响文档的渲染\n此外，**注释的嵌套是不被允许的（一个有效的注释语法的文本内容中不得出现其他 \\[!note] 标签）**，\n不推荐、也请不要在注释语法里写注释语法。\n隐藏或显示取决于渲染器的配置，但根据功能的定位：\n在正式发行时，需配置渲染器进行隐藏\n在平时编辑时，不需要配置渲染器进行隐藏\n\n特别的，\n如果你需要使用类似 \\[!note] 或 \\[/!note] 的纯字符串在正常的文档流中，则需要写成 `\\\\\\[!note]` 或 `\\\\\\[/!note]` 的格式在文档数据中\n\n但一些Markdown的标签可能会或者不会解析一定的转义字符，所以具体的转义字符用多少需要你们自己观察和权衡。\n例如，在普通段落中，写 `\\\\\\\\[!note]` 才可得到 `\\\\[!note]`；而在代码块中，只需写成 <code>\\`\\\\\\\\\\[!note]\\`</code> 即可得到 `\\\\[!note]` 。具体情况请自行测试。\n但本人可以保证，你先写成 `\\\\[!note]` 绝对是先被编译成 `[!note]` 替换到进原字符串的，即默认先转义注释语法，而后再去参与Markdown的其他编译的；\n\n简单的说：\n如果文本出现字符串“\\\\\\[!note]”（不包含引号），那么直接将“\\\\\\[!note]”替换成“\\[!note]”再参与正常的markdown处理。\n我担心的是因为markdown原生关于转义与不转义本来就有争议，所以一些需要打印转义字符的场景需要权衡。\n只不过注释语法完全是最高的语法，不在乎任何标签。就是硬核替换。\n所谓的转义字符的数量问题，可以归结于这样：\n\n如果你需要渲染出类似 \\\\\\\\\\\\……\\\\\\\\\\[!note] 的字符串\n记需要渲染的转义的数量为n（即 \\[!note] 前面的转义字符的数量）\n那么你需要写到文档元数据里的转义字符的数量则是这样计算：\n\n- 如果上下文会转义转义字符，即两个转义字符“\\\\\\\\”才能得到一个转义字符“\\\\”，那么实际转义书写的转义字符数量则为： 2n+1\n- 如果上下文不会转义转义字符，即一个转义字符“\\\\”就是对应一个转义字符“\\\\”，那么实际需要书写的转义字符数量则为： n+1\n\n为什么要有一个硬要加的1。\n因为“\\[!note]”本身就是注释语法，而只有前面加上“\\\\”，即写成“\\\\\\[!note]”才会让渲染器认为这是一个字符串，即渲染出来才会是一个字符串“[!note]”\n这下总算理解了吧。\n\n不要依赖 没有头标签的 \\[\\/!note] 或 无尾标签的 \\[!note] 来实现这类需求，这可能导致文档的布局混乱\n另外，考虑到 \\[!note] 的布局，当你写成：\n```txt\n文本1\n\\[!note]隐藏的注释文本\\[/!note]\n文本2\n```\n如果保留注释，则编译后是：\n```txt\n文本1\n隐藏的注释文本\n文本2\n```\n当你写成：\n```txt\n文本1\n\\[!note]\n隐藏的注释文本\n\\[/!note]\n文本2\n```\n如果保留注释，则编译后还是：\n```txt\n文本1\n隐藏的注释文本\n文本2\n```\n因为我觉得 \\[!note] 可以稍微的独占一行，但是所在行不参与行数计算\n这样子布局更合理，而不是写成如同html的诡异强内联形式。避免一些无脑吞行、暴力换行的不良编辑体验\n不过note标签**最多吞下首尾各一行**，如果你写成：\n```txt\n文本1\n\\[!note]\n\n隐藏的注释文本\n\n\\[/!note]\n文本2\n```\n如果保留注释，则编译后是：\n```txt\n文本1\n\n隐藏的注释文本\n\n文本2\n```\n在我看来这样才是合理的布局方式\n\n### 文档兼容相关的问题\n导入时，如果是以.md结尾，则直接以纯文本导入到编辑器里（但渲染器仍然默认为当前配置，不会自动切换和更改）；\n如果是以.json或者其他文件后缀结尾，则直接进行json解析，格式、必要字段不正确则无法导入；\n特别的，在解析过程中只是因为文档解析错误导致报错（连json都不是的那种，则很可能是一个纯文本文档），而非解析后的字段错误（如过了json的解析，但markdown字段缺失这种错误），则以纯文本方式打开。\n\n## 理念\n这是一个独立于传统Markdown渲染的编辑器，支持混合html语法进行编辑\n主要用于提升撰写文章时的舒适感\n\n因为原生Markdown不支持非路径参数的图片加载\n就算能内联图片原数据也会导致文章主体臃肿\n因此采取分离数据以及自定义语法来映射ID与图片原数据，同时不可避免的推出独立的文档格式\n但也不是坏事，至少可以在自己格式上解决更多的痛点\n反正从某时刻开始已经不能完美兼容了，干脆不考虑一些无意义的兼容算了\n\n考虑到实际的编辑需求\n推出非发行版注释功能\n在渲染器中，可以选择是否渲染注释中的内容\n这样编辑时不用特别区分文章的发行版本和编辑版本，读者也再不用陷入“笔记地狱”",
